name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: Checks on ${{ matrix.os }} (Node 24)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run format:check
      - run: npm pack --dry-run
  integration:
    name: Real Editor Services and Lumine integration
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      LUMINE_JASMINE_REPORTER: list
      LUMINE_TEST_PACKAGES: ide language-powershell
      PSES_VERSION: 4.7.0
      REQUIRE_PSES: 1
    steps:
      - uses: actions/checkout@v7
        with:
          path: ide-powershell
      - uses: actions/checkout@v7
        with:
          repository: lumine-code/lumine
          path: lumine
      - uses: actions/checkout@v7
        with:
          repository: lumine-code/ide
          path: ide
      - uses: actions/checkout@v7
        with:
          repository: lumine-code/language-powershell
          path: language-powershell
      - uses: actions/setup-node@v7
        with:
          node-version-file: lumine/.nvmrc
          cache: npm
          cache-dependency-path: lumine/package-lock.json
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update || true
          sudo apt-get install -y xvfb libx11-dev libxkbfile-dev libsecret-1-dev
      - name: Provision exact verified runtime and complete server without system installation
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.test-tools/pwsh" "$GITHUB_WORKSPACE/.test-tools/pses"
          curl --fail --location --retry 2 --output "$GITHUB_WORKSPACE/.test-tools/pwsh.tar.gz" https://github.com/PowerShell/PowerShell/releases/download/v7.6.6/powershell-7.6.6-linux-x64.tar.gz
          echo "ddbc4a2d113bbd46d283cfedcbcd117a70caefd7673f41f2b4e0000badf103bc  $GITHUB_WORKSPACE/.test-tools/pwsh.tar.gz" | sha256sum --check
          tar -xzf "$GITHUB_WORKSPACE/.test-tools/pwsh.tar.gz" -C "$GITHUB_WORKSPACE/.test-tools/pwsh"
          chmod +x "$GITHUB_WORKSPACE/.test-tools/pwsh/pwsh"
          curl --fail --location --retry 2 --output "$GITHUB_WORKSPACE/.test-tools/pses.zip" https://github.com/PowerShell/PowerShellEditorServices/releases/download/v4.7.0/PowerShellEditorServices.zip
          echo "5084f0326cc88539e9d880b08f6c52ce5be4672bb8ecee8921e35f8895a6b9d7  $GITHUB_WORKSPACE/.test-tools/pses.zip" | sha256sum --check
          unzip -q "$GITHUB_WORKSPACE/.test-tools/pses.zip" -d "$GITHUB_WORKSPACE/.test-tools/pses"
          echo "POWERSHELL_RUNTIME_PATH=$GITHUB_WORKSPACE/.test-tools/pwsh/pwsh" >> "$GITHUB_ENV"
          echo "POWERSHELL_SERVER_PATH=$GITHUB_WORKSPACE/.test-tools/pses/PowerShellEditorServices/Start-EditorServices.ps1" >> "$GITHUB_ENV"
      - name: Use HTTPS for public Git dependencies
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - name: Install adapter dependencies
        working-directory: ide-powershell
        run: npm ci --ignore-scripts
      - name: Install client dependencies
        working-directory: ide
        run: npm ci --ignore-scripts
      - name: Install editor dependencies
        working-directory: lumine
        run: |
          install() { npm ci --ignore-scripts; }
          install || install || install
      - name: Prepare Electron
        working-directory: lumine
        run: |
          node node_modules/electron/install.js
          npm run build
      - name: Link editor service packages
        run: |
          echo "LUMINE_HOME=$GITHUB_WORKSPACE/.test-home" >> "$GITHUB_ENV"
          mkdir -p "$GITHUB_WORKSPACE/.test-home/packages"
          ln -s "$GITHUB_WORKSPACE/ide" "$GITHUB_WORKSPACE/.test-home/packages/ide"
          ln -s "$GITHUB_WORKSPACE/language-powershell" "$GITHUB_WORKSPACE/.test-home/packages/language-powershell"
      - name: Run actual server, managed install and editor specs
        working-directory: lumine
        timeout-minutes: 20
        run: xvfb-run --auto-servernum npm start -- --dev --test ../ide-powershell/spec
